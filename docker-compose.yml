version: "3.9"

services:
  neo4j:
    image: neo4j:5.20
    container_name: neo4j-artist
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/password
      - NEO4J_server_memory_pagecache_size=1G
      - NEO4J_server_memory_heap_initial__size=1G
      - NEO4J_server_memory_heap_max__size=2G
    volumes:
      - ./neo4j/data:/data
      - ./neo4j/logs:/logs
      - ./neo4j/init.cypher:/init.cypher

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        HF_EMBED_MODEL: intfloat/multilingual-e5-small
    container_name: artistas-app
    depends_on:
      - neo4j
    ports:
      - "8501:8501"
    env_file:
      - .env
    environment:
      NEO4J_URI: bolt://neo4j:7687
